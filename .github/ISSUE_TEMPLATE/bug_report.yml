name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include secrets, private project content or real Agent session logs. Report security issues privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `padcode`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Padcode version
      description: Output of `padcode --version`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and CPU
      placeholder: macOS 15.5, Apple silicon
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller and connection
      placeholder: DualShock 4 over Bluetooth
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.1.x, Codex 0.161.0, ...
  - type: input
    id: terminal
    attributes:
      label: Terminal, and whether tmux is installed
      placeholder: Ghostty 1.2, tmux 3.5a
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: Optional. Output with `PADCODE_INPUT_TRACE=1` contains routing metadata only, but please review it before posting.
      render: text
