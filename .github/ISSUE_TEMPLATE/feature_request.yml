name: Feature request
description: Suggest a new capability or a change in behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do with your controller and Agent, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Which buttons, menus or settings would you expect?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Controller, Agent, terminal and anything else that matters. Padcode stays a local CLI with your own Agent; it does not bundle model services or run tasks automatically.
